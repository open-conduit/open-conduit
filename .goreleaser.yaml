# Release builds. The release workflow (.github/workflows/release.yml, run by
# hand) has semantic-release tag the next version, then runs this with the
# notes it wrote. `make release-snapshot` runs it locally (and CI on pull
# requests) with --snapshot, which builds everything and publishes nothing.
version: 2
project_name: open-conduit
# dist/ also holds `make cross-build` and `make packages` output; --clean
# removes only this directory.
dist: dist/release

before:
  hooks:
    - go mod tidy -diff
    # The bundled extension packages (extensions/<name>/ in each archive),
    # such as setup from github.com/open-conduit/extension-setup, pinned in
    # go.mod. The daemon finds them beside the real binary; one installed in
    # the config directory replaces the bundled copy.
    - scripts/bundle-packages.sh dist/bundled darwin_amd64 darwin_arm64 linux_amd64 linux_arm64

builds:
  - id: open-conduit
    main: ./cmd/open-conduit
    binary: open-conduit
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # A release pins the gateway image it published (scripts/publish-gateway.sh,
    # run by the release before this) by digest; a snapshot has none. It also
    # embeds the usage telemetry key (the POSTHOG_TELEMETRY_KEY repository
    # variable); without one the binary sends no telemetry.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X github.com/open-conduit/open-conduit/extensions/docker.GatewayImage={{ index .Env "GATEWAY_IMAGE" }} -X github.com/open-conduit/open-conduit/internal/bootstrap.usageKey={{ index .Env "POSTHOG_TELEMETRY_KEY" }}
  # The toolbelt that runs call. It lives beside open-conduit, which finds it
  # there (through a symlink too); it is never put on PATH by the cask.
  - id: os
    main: ./cmd/os
    binary: os
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - ids: [open-conduit, os]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - SECURITY.md
      - docs/**/*
      - src: dist/bundled/{{ .Os }}_{{ .Arch }}/extensions
        dst: extensions
        strip_parent: false

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

# semantic-release writes the notes from the Conventional Commits and passes
# them in with --release-notes, which the changelog pipe reads instead of
# building its own list from git. Don't set `changelog.disable`: it skips that
# pipe, the notes file is never read and the release goes out with an empty
# body (every release up to 1.8.0 did).

release:
  github:
    owner: open-conduit
    name: open-conduit

# `brew install open-conduit/tap/open-conduit`. Needs the repo
# open-conduit/homebrew-tap and a HOMEBREW_TAP_TOKEN secret that can push to
# it; without the secret this step is skipped and the release goes ahead.
# Only open-conduit is linked onto PATH: `os` is a generic name, so it stays
# in the cask's own directory beside open-conduit, which resolves its link to
# find it. Nothing here touches Open Supervisor's cask (open-supervisor in
# alsiola/homebrew-tap), its binary or its config and state directories.
homebrew_casks:
  - name: open-conduit
    ids: [default]
    binaries: [open-conduit]
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: open-conduit
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/open-conduit/open-conduit
    description: Runs coding and support agents against GitHub issues, Slack threads and schedules from one local daemon
    # A cask can't carry a `brew services` block (that is formula-only), so
    # `open-conduit service install` writes the LaunchAgent. Homebrew runs a
    # cask's uninstall stanza on every upgrade as well as on uninstall, so the
    # LaunchAgent is only removed by `brew uninstall --zap`. An upgrade keeps
    # the service: the old daemon stops when its version's directory is
    # removed (bootstrap.ErrInstallRemoved) and launchd starts the new one.
    # The label is launchdLabel in internal/cli/service.go.
    caveats: |
      Run the daemon in the background (a per-user launchd service that starts at login):
        open-conduit service install
      Upgrades restart it on the new version. Remove it with
      open-conduit service uninstall before brew uninstall, or use brew uninstall --zap.
      Upgrading from 1.6.2 or earlier removes the service once: if
      open-conduit service status says not installed, run open-conduit service install.
    zap:
      launchctl:
        - com.open-conduit.daemon
    # The binaries aren't notarized, so the quarantine flag comes off after
    # install. Written as postflight_steps rather than through hooks, which
    # GoReleaser renders as the `postflight` block Homebrew deprecates.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:           ["-dr", "com.apple.quarantine", "open-conduit", "os", "extensions"],
              chdir:          ".",
              writable_paths: ["open-conduit", "os", "extensions"]
        end
      end
