name: docs
on:
  push:
    branches: [main]
    paths: [site/**, go.mod, .github/workflows/docs.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Whether a PR touches the site: site/, or the go.mod pin of the setup
  # package, whose guide it publishes as setup-guide.md (read from the
  # module cache), or this workflow. Pushes and manual runs build anyway.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo site=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          site=false
          while IFS= read -r f; do
            case "$f" in
              site/*|go.mod|.github/workflows/docs.yml) site=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "site=$site" | tee -a "$GITHUB_OUTPUT"
  # Builds the Starlight site and publishes it to GitHub Pages from main.
  # build is a required check, so the workflow runs on every PR and build
  # is skipped (which passes) when the site is untouched. If changes
  # fails, build runs rather than skipping, so it fails closed.
  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download github.com/open-conduit/extension-setup
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
