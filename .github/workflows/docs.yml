name: docs
on:
  push:
    branches: [main]
    paths: [site/**, extensions/setup/playbook/**, .github/workflows/docs.yml]
  pull_request:
    paths: [site/**, extensions/setup/playbook/**, .github/workflows/docs.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Builds the Starlight site in site/ on every PR that changes it (or the
  # setup guide it publishes as setup-guide.md), and
  # publishes it to GitHub Pages from main. No branch protection requires
  # it, so filtering on paths can't hold a PR up.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
