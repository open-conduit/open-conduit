name: contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What a PR touches. Docs are site/, docs/**/*.md and the Markdown at the
  # repository root; anything else is code (the playbooks' Markdown is
  # embedded in the binaries, so it is code too). The required jobs below
  # always run, so branch protection sees every check report, but skip
  # their steps when there is nothing for them to check. Pushes to main
  # check everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\ndocs=true\nworkflows=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false docs=false workflows=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*) workflows=true; code=true ;;
              site/*|docs/*.md) docs=true ;;
              */*) code=true ;;
              *.md) docs=true ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          printf 'code=%s\ndocs=%s\nworkflows=%s\n' "$code" "$docs" "$workflows" | tee -a "$GITHUB_OUTPUT"
  # make check, spread over parallel jobs so the check takes as long as its
  # slowest part rather than the sum: the static checks and build (with the
  # config contract and docs-check), the unit tests, the integration package
  # in four runners of three shards each (scripts/test-integration.sh shares
  # its tests out by expected duration), and the TypeScript checks with
  # certify. check below is the one required check and fails if any of them
  # did. Every Go job restores its own build cache from main (see
  # .github/actions/go), so a pull request only compiles what it changed.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: static
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make config-deps
      - run: make check-static
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled()
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # -count=1: the restored cache holds main's test results too, and every
  # test runs on every change, as it did before the cache.
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: unit
      - run: make test-unit
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled()
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: integration (${{ matrix.group }}/4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            shards: 1 2 3
          - group: 2
            shards: 4 5 6
          - group: 3
            shards: 7 8 9
          - group: 4
            shards: 10 11 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: integration
      - run: make test-integration INTEGRATION_SHARDS=12 INTEGRATION_RUN='${{ matrix.shards }}'
      # The groups build the same things, so one saves for all four.
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled() && matrix.group == 1
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # The TypeScript SDK's checks on current Node, and the CLI's
  # certification of the built packages.
  certify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: certify
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make ts-deps
      - run: make ts-check
      - run: make certify
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled()
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # The required check: passes when every part above passed, or was skipped
  # because no code changed.
  check:
    needs: [changes, static, unit, integration, certify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A part of check failed; see its job."
            exit 1
          fi
  # The TypeScript SDK's typecheck and tests on the oldest Node its
  # package.json supports (engines: >=22.18).
  ts-node22:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: '22.18'
      - run: make ts-deps
        if: env.RUN == 'true'
      - run: make ts-check
        if: env.RUN == 'true'
  cross-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: cross-build
      - run: make cross-build
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled()
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # Real isolation tests for process sandboxes (B09): srt from npm and, on
  # Linux, bubblewrap, socat and ripgrep, with Ubuntu 24.04's AppArmor
  # restriction on unprivileged user namespaces relaxed for the job.
  # macos-latest is off while GitHub is short of macOS runners; add it back
  # to the matrix to restore the macOS run. OPEN_CONDUIT_SANDBOX_TESTS makes
  # a missing srt fail the tests instead of skipping them.
  sandbox:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code }}
      OPEN_CONDUIT_SANDBOX_TESTS: "1"
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: ./.github/actions/go
        id: go
        if: env.RUN == 'true'
        with:
          cache: sandbox-${{ matrix.os }}
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/sandbox-runtime@0.0.81
        if: env.RUN == 'true'
      - if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test -count=1 -v -run 'TestSandbox|TestSweepFindsSandboxedChildren|TestHealth' ./integration/ ./extensions/git/ ./extensions/srt/ ./extension/
        if: env.RUN == 'true'
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled() && env.RUN == 'true'
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # Real isolation tests for the Docker container provider on the runner's
  # own Docker Engine: reads and writes, the network, every fail-closed
  # case, Stop, Interrupt, Inject and each Recover path, the gateway built
  # from this tree (its proxy, its toolbelt forward and doctor's preflight)
  # and the shell executor in a container. The second pass forces the tcp
  # toolbelt forward macOS uses, so CI covers its code too. macOS itself is
  # checked by a local make container-test run, not here.
  # OPEN_CONDUIT_CONTAINER_TESTS makes a missing Docker fail the tests
  # instead of skipping them.
  container:
    needs: changes
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: ./.github/actions/go
        id: go
        if: env.RUN == 'true'
        with:
          cache: container
      - run: docker version
        if: env.RUN == 'true'
      - run: make container-test
        if: env.RUN == 'true'
      - run: make container-test CONTAINER_TEST_RUN='TestDockerGateway|TestDockerShell|TestDockerGitCredential'
        if: env.RUN == 'true'
        env:
          OPEN_CONDUIT_CONTAINER_FORWARD: tcp
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled() && env.RUN == 'true'
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
  # A docs-only change still has its examples checked: the configs validate,
  # and the commands and make targets they show exist. A change with code
  # gets this from the static job above.
  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go
        id: go
        with:
          cache: static
      - run: make docs-check
  # Packaging breaks show up here, before anyone tags: every platform's
  # archive, the checksums and the Homebrew cask, built and smoke-tested
  # without publishing anything, with the same stable Go the release uses.
  release-snapshot:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to package."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go
        id: go
        if: env.RUN == 'true'
        with:
          cache: cross-build
      - uses: goreleaser/goreleaser-action@v7
        if: env.RUN == 'true'
        with:
          version: "~> v2"
          install-only: true
      - run: make release-snapshot
        if: env.RUN == 'true'
  workflows:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.workflows }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No workflow changed; nothing to lint."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: ./.github/actions/go
        id: go
        if: env.RUN == 'true'
        with:
          cache: workflows
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        if: env.RUN == 'true'
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && !cancelled() && env.RUN == 'true'
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
