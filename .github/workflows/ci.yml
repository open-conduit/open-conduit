name: contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What a PR touches. Docs are site/, docs/**/*.md and the Markdown at the
  # repository root; anything else is code (the playbooks' Markdown is
  # embedded in the binaries, so it is code too). The required jobs below
  # always run, so branch protection sees every check report, but skip
  # their steps when there is nothing for them to check. Pushes to main
  # check everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\ndocs=true\nworkflows=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false docs=false workflows=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*) workflows=true; code=true ;;
              site/*|docs/*.md) docs=true ;;
              */*) code=true ;;
              *.md) docs=true ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          printf 'code=%s\ndocs=%s\nworkflows=%s\n' "$code" "$docs" "$workflows" | tee -a "$GITHUB_OUTPUT"
  # One runner: make check includes docs-check and the daemon drills (they
  # are part of test), so drill isn't run again. certify adds the CLI's
  # certification of the built packages. cross-build runs in its own job
  # alongside, not after.
  check:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-python@v7
        if: env.RUN == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 24
      - run: make config-deps
        if: env.RUN == 'true'
      - run: make ts-deps
        if: env.RUN == 'true'
      - run: make check
        if: env.RUN == 'true'
      - run: make ts-check
        if: env.RUN == 'true'
      - run: make certify
        if: env.RUN == 'true'
  # The TypeScript SDK's typecheck and tests on the oldest Node its
  # package.json supports (engines: >=22.18).
  ts-node22:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: '22.18'
      - run: make ts-deps
        if: env.RUN == 'true'
      - run: make ts-check
        if: env.RUN == 'true'
  cross-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: make cross-build
  # Real isolation tests for process sandboxes (B09) on both platforms srt
  # supports: srt from npm and, on Linux, bubblewrap, socat and ripgrep, with Ubuntu
  # 24.04's AppArmor restriction on unprivileged user namespaces relaxed for
  # the job. OPEN_CONDUIT_SANDBOX_TESTS makes a missing srt fail the tests
  # instead of skipping them.
  sandbox:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code }}
      OPEN_CONDUIT_SANDBOX_TESTS: "1"
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/sandbox-runtime@0.0.81
        if: env.RUN == 'true'
      - if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test -count=1 -v -run 'TestSandbox|TestSweepFindsSandboxedChildren|TestHealth' ./integration/ ./extensions/git/ ./extensions/srt/ ./extension/
        if: env.RUN == 'true'
  # Real isolation tests for the Docker container provider on the runner's
  # own Docker Engine: reads and writes, the network, every fail-closed
  # case, Stop, Interrupt, Inject and each Recover path, the gateway built
  # from this tree (its proxy, its toolbelt forward and doctor's preflight)
  # and the shell executor in a container. The second pass forces the tcp
  # toolbelt forward macOS uses, so CI covers its code too. macOS itself is
  # checked by a local make container-test run, not here.
  # OPEN_CONDUIT_CONTAINER_TESTS makes a missing Docker fail the tests
  # instead of skipping them.
  container:
    needs: changes
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to check."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: stable
          cache: true
      - run: docker version
        if: env.RUN == 'true'
      - run: make container-test
        if: env.RUN == 'true'
      - run: make container-test CONTAINER_TEST_RUN='TestDockerGateway|TestDockerShell|TestDockerGitCredential'
        if: env.RUN == 'true'
        env:
          OPEN_CONDUIT_CONTAINER_FORWARD: tcp
  # A docs-only change still has its examples checked: the configs validate,
  # and the commands and make targets they show exist. A change with code
  # gets this from make check above.
  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: make docs-check
  # Packaging breaks show up here, before anyone tags: every platform's
  # archive, the checksums and the Homebrew cask, built and smoke-tested
  # without publishing anything, with the same stable Go the release uses.
  release-snapshot:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No code changed; nothing to package."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        if: env.RUN == 'true'
        with:
          version: "~> v2"
          install-only: true
      - run: make release-snapshot
        if: env.RUN == 'true'
  workflows:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.workflows }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No workflow changed; nothing to lint."
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-go@v7
        if: env.RUN == 'true'
        with:
          go-version: stable
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        if: env.RUN == 'true'
