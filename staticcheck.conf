# staticcheck's default checks, run by make lint (Makefile).
#
# S1016 (convert between struct types instead of writing a literal) is off:
# the literals it flags copy between wire or config types that happen to share
# fields today (protocol.ArtifactCreateResult to protocol.ArtifactTarget,
# schedule's ExtensionConfig to Settings). A conversion would tie the two
# types together and stop compiling when either gains a field, which is the
# opposite of what keeping them separate is for.
checks = ["inherit", "-S1016"]
