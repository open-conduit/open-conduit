{{define "content"}}{{$d := .Data}}
<a class="back" href="/run?id={{$d.RunID}}">Back to the run</a>
<div class="head">
  <h1 class="mono">{{$d.Out.Title}}</h1>
  <nav class="seg" aria-label="Outputs">
    <a href="/output?run={{$d.RunID}}&amp;pick=log"{{if eq $d.Pick "log"}} aria-current="true"{{end}}>Log</a><a href="/output?run={{$d.RunID}}&amp;pick=transcript"{{if eq $d.Pick "transcript"}} aria-current="true"{{end}}>Transcript</a>{{if gt $d.Out.Count 1}}<a href="/output?run={{$d.RunID}}&amp;pick={{$d.Next}}">Next output</a>{{end}}
  </nav>
</div>
{{if $d.Out.Live}}<p class="following" id="following"><span class="pulse" aria-hidden="true"></span><span id="following-text">Following the live output</span></p>{{end}}
<pre id="output" class="log"{{if $d.Out.Live}} data-follow="/output?run={{$d.RunID}}&amp;pick={{$d.Pick}}&amp;format=json"{{end}}>{{$d.Out.Text}}</pre>
{{end}}

{{define "scripts"}}<script src="/static/work.js" defer></script>{{end}}
